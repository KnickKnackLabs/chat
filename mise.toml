[settings]
experimental = true
quiet = true
task_output = "interleave"

[plugins]
shiv = "https://github.com/KnickKnackLabs/vfox-shiv"

[tools]
jq = "latest"
gum = "latest"
zellij = "0.44.3"
fzf = "0.73.1"
uv = "latest"
bats = "1.13.0"
"shiv:blobs" = "0.1"
"shiv:codebase" = "0.3"                    # Codebase linting + migrations
"shiv:readme" = "0.3"

[_.codebase]
lint = [
  "mise-settings",
  "gum-table",
  "bats-test-helper",
  "bats-test-task",
  "mcr-scope",
  "or-true",
  "shellcheck",
  "caller-pwd-contract",
  "github-actions",
]
