[settings]
experimental = true
quiet = true
task_output = "interleave"
aqua.registries = ["https://github.com/KnickKnackLabs/bats-core"]

[plugins]
shiv = "https://github.com/KnickKnackLabs/vfox-shiv"

[tools]
jq = "latest"
gum = "latest"
zellij = "0.44.3"
fzf = "0.73.1"
uv = "latest"
"aqua:KnickKnackLabs/bats-core" = "1.14.0-kkl.1"
"aqua:shenwei356/rush" = "0.9.0"
"shiv:blobs" = "0.1"
"shiv:codebase" = "0.4"                    # Codebase linting + migrations
"shiv:readme" = "0.3"

[_.codebase]
name = "chat"
lint = ["@all"]
